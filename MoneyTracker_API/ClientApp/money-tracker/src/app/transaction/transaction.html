<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<div class="container-fluid bg-dark w-100" style="margin-top: 43px; padding-top: 20px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-success">Transactions</h2>
        <button class="btn btn-success d-flex align-items-center" (click)="exportToExcel()">
            <i class="bi bi-file-earmark-excel me-2"></i> <!-- Bootstrap Icon -->
            Export to Excel
        </button>
    </div>
    <table id="example" class="table table-striped table-hover table-dark">
        <thead>
            <tr>
                <th>#</th>
                <!-- Sorting by Amount -->
                <th (click)="onSort('Amount')" style="cursor: pointer;">
                    Amount
                    <i class="bi" [ngClass]="{
                             'bi-sort-up': currentSortBy() === 'Amount' && currentSortOrder() === 'asc',
                             'bi-sort-down': currentSortBy() === 'Amount' && currentSortOrder() === 'desc',
                             'text-muted': currentSortBy() !== 'Amount'
                           }"></i>
                </th>
                <!-- Sorting by Date -->
                <th (click)="onSort('TransactionDate')" style="cursor: pointer;">
                    Transaction Date
                    <i class="bi" [ngClass]="{
                             'bi-sort-up': currentSortBy() === 'TransactionDate' && currentSortOrder() === 'asc',
                             'bi-sort-down': currentSortBy() === 'TransactionDate' && currentSortOrder() === 'desc',
                             'text-muted': currentSortBy() !== 'TransactionDate'
                           }"></i>
                </th>
                <th>Category Name</th>
                <th>Payment Method</th>
                <th>Recurrence Type</th>
            </tr>
        </thead>
        <tbody>
            @for(trans of transactionList(); track trans.id){
            <tr>
                <td>{{trans.id}}</td>
                <td>${{trans.amount}}</td>
                <td>{{trans.transactionDate | date: 'short'}}</td>
                <td> {{trans.categoryName}}
                    <!-- <pre style="display:none">{{ trans | json }}</pre>
        {{ trans.categoryName || trans.category || trans.categoryId || 'MISSING' }} -->
                </td>
                <td>{{trans.paymentMethodName}}</td>
                <td>{{trans.recurrenceType}}</td>
            </tr>
            }
        </tbody>
        <!-- <tfoot>
            <tr>
                <th>Name</th>
                <th>Position</th>
                <th>Office</th>
                <th>Age</th>
                <th>Start date</th>
                <th>Salary</th>
            </tr>
        </tfoot> -->
    </table>
</div>
